<title>今日はこれ 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface-2:#F4F6F2; --ink:#1E2621; --ink-2:#5B665F; --line:#D9DFD8;
  --accent:#2E7A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEBDF;
  --yolk:#E9A81C; --yolk-soft:#FCEFC7; --yolk-ink:#6B4A00;
  --plate-s:52%; --plate-l:87%; --plate-ink:#1E2621;
  --shadow:0 1px 2px rgba(30,38,33,.06),0 8px 24px rgba(30,38,33,.08);
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101512; --surface:#182019; --surface-2:#1F2921; --ink:#E6ECE7; --ink-2:#9AA79F; --line:#2C372F;
    --accent:#6CC28E; --accent-ink:#0E1A12; --accent-soft:#213A2A;
    --yolk:#F5C451; --yolk-soft:#3A3019; --yolk-ink:#F5DFA4;
    --plate-s:28%; --plate-l:26%; --plate-ink:#E6ECE7;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101512; --surface:#182019; --surface-2:#1F2921; --ink:#E6ECE7; --ink-2:#9AA79F; --line:#2C372F;
  --accent:#6CC28E; --accent-ink:#0E1A12; --accent-soft:#213A2A;
  --yolk:#F5C451; --yolk-soft:#3A3019; --yolk-ink:#F5DFA4;
  --plate-s:28%; --plate-l:26%; --plate-ink:#E6ECE7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.proto-note{margin:10px 16px 0;padding:6px 10px;border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--ink-2)}
main{flex:1;padding:0 16px 24px}
.screen{display:flex;flex-direction:column;gap:16px}

.top{display:flex;align-items:flex-end;justify-content:space-between;padding-block:14px 2px}
.brand{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:12px 0 4px;color:var(--ink-2);font-size:14px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.fridge-on{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:13px}
.fridge-on span{flex:1}
.x{border:0;background:none;color:var(--ink-2);font-size:13px;text-decoration:underline;padding:4px}

.pick{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.pick-head{display:flex;gap:16px;align-items:center}
.plate{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,hsl(var(--h) var(--plate-s) calc(var(--plate-l) + 4%)) 0 52%,hsl(var(--h) var(--plate-s) var(--plate-l)) 53% 100%);
  box-shadow:inset 0 0 0 6px hsl(var(--h) var(--plate-s) calc(var(--plate-l) - 6%));
  font-family:var(--f-disp);font-weight:900;font-size:40px;color:var(--plate-ink)}
.plate.big{width:120px;height:120px;font-size:52px}
.dish{font-family:var(--f-disp);font-weight:900;font-size:26px;line-height:1.25;text-wrap:balance;margin:0}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-family:var(--f-disp);font-weight:900;font-size:28px}
.price span{color:var(--ink-2);font-size:13px}
.reason{background:var(--yolk-soft);color:var(--yolk-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55}
.reason::before{content:"選んだ理由　";font-weight:700}

.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.linkish{background:none;border:0;color:var(--ink-2);font-size:14px;padding:6px;text-decoration:underline;text-underline-offset:3px}
.center{display:flex;justify-content:center}

.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left}
.tile .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile b{display:block;font-size:15px}
.tile small{color:var(--ink-2);font-size:12.5px}
.tile .chev{margin-left:auto;color:var(--ink-2)}

.month{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.month-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
.month-row b{font-family:var(--f-disp);font-size:20px;color:var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .used{background:var(--accent)}

h2{font-family:var(--f-disp);font-weight:900;font-size:20px;margin:0}
h3{font-size:14px;margin:0;color:var(--ink-2);letter-spacing:.06em}
.panel{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.ing{width:100%;border-collapse:collapse;font-size:14px}
.ing td{padding:7px 0;border-bottom:1px dashed var(--line)}
.ing td:nth-child(2){color:var(--ink-2);padding-inline:8px;white-space:nowrap}
.ing td:last-child{text-align:right;white-space:nowrap}
.ing tr.total td{border-bottom:0;font-weight:700;padding-top:10px}
.stepper{display:flex;align-items:center;gap:10px;font-size:14px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:14.5px}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.side-note{font-size:14px;margin:0}
.side-note b{display:block;font-size:13px;color:var(--ink-2)}

.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:20px;padding:28px 16px;background:var(--surface);text-align:center;cursor:pointer}
.upload .ic{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.upload b{font-size:16px}
.upload small{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.photo{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:16px;object-fit:cover;background:var(--surface-2)}
.scan{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found .chip{font-size:14px;padding:8px 12px}
.found .chip.unsure{border-style:dashed}
.found .chip em{font-style:normal;font-size:11px;margin-left:4px;opacity:.8}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.addrow button{border:0;border-radius:12px;padding:0 14px;background:var(--surface-2);font-weight:700}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.item input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.item span{flex:1}
.item.done span{color:var(--ink-2);text-decoration:line-through}
.item em{font-style:normal;color:var(--ink-2);font-size:13px}
.empty{text-align:center;color:var(--ink-2);padding:32px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi small{color:var(--ink-2);font-size:12px}
.kpi b{display:block;font-family:var(--f-disp);font-weight:900;font-size:22px}
.kpi.wide{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c-meat{background:hsl(14 62% 56%)} .c-fish{background:hsl(205 55% 52%)} .c-noodle{background:hsl(42 80% 52%)} .c-egg{background:hsl(150 35% 50%)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hrow small{color:var(--ink-2)}
.hrow .src{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-left:6px}
.hrow .src.real{background:var(--accent-soft);color:var(--accent)}

nav.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-2);position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge[hidden]{display:none}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--yolk);color:#3A2800;font-size:11px;font-weight:700;display:grid;place-items:center}

.sheet-wrap{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:420px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.money-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface-2)}
.money-in input{flex:1;min-width:0;border:0;background:none;font-family:var(--f-disp);font-weight:900;font-size:26px;outline:none}
.hint{font-size:13px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>

const yen=n=>Math.round(n).toLocaleString("ja-JP");
const menuCost=(m,p=settings.people)=>m.ings.reduce((a,i)=>a+i[2],0)*p/BASE_PEOPLE;
const perPerson=m=>menuCost(m,BASE_PEOPLE)/BASE_PEOPLE;
const dayNum=d=>+d.split("/")[1];
function daysAgo(d){return 24-dayNum(d)}
function seeded(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}

function flags(m){
  const f=[];
  if(m.time<=20)f.push("時短");
  if(perPerson(m)<=230)f.push("節約");
  return f.concat(m.tags);
}

/* ===== 提案の点数づけ ===== */
function rankMenus(){
  const recent=LOGS.slice().sort((a,b)=>dayNum(b.d)-dayNum(a.d));
  const y=recent[0], y2=recent[1];
  const within=(n)=>recent.filter(l=>daysAgo(l.d)<=n);
  const score=(m,noRepeatDays)=>{
    if(within(noRepeatDays).some(l=>l.id===m.id))return null;
    if(perPerson(m)>settings.perPersonBudget)return null;
    for(const f of S.filters) if(!flags(m).includes(f))return null;
    let s=100;
    if(y && m.main===y.main)s-=40;
    if(y2 && m.main===y2.main)s-=15;
    if(y && m.genre===y.genre)s-=20;
    if(within(3).some(l=>l.taste===m.taste))s-=15;
    const hit=m.ings.filter(i=>S.fridge.some(f=>i[0].includes(f)||f.includes(i[0]))).length;
    s+=hit*25;
    s+=seeded(m.id)*10;
    return {m,s,hit};
  };
  let list=MENUS.map(m=>score(m,14)).filter(Boolean);
  if(list.length<3) list=MENUS.map(m=>score(m,7)).filter(Boolean);
  list.sort((a,b)=>b.s-a.s);
  S.rank=list; S.idx=0;
}
function current(){return S.rank[S.idx]}
function nextPick(){
  if(S.rank.length<2)return;
  const cur=current().m;
  for(let k=1;k<S.rank.length;k++){
    const j=(S.idx+k)%S.rank.length, c=S.rank[j].m;
    if(c.genre!==cur.genre||c.main!==cur.main){S.idx=j;return}
  }
  S.idx=(S.idx+1)%S.rank.length;
}
function reasonFor(r){
  const m=r.m, recent=LOGS.slice().sort((a,b)=>dayNum(b.d)-dayNum(a.d));
  const y=recent[0], y2=recent[1];
  const bits=[];
  if(r.hit>0){
    const used=m.ings.filter(i=>S.fridge.some(f=>i[0].includes(f)||f.includes(i[0]))).map(i=>i[0]);
    bits.push(`冷蔵庫の${used.slice(0,3).join("・")}が使えます。`);
  }
  const catWord=c=>c==="魚"?"お魚":c==="肉"?"お肉":c;
  if(y){
    bits.push(`昨日は${catWord(y.cat)}（${y.name}）${y2?`、おとといは${y2.main}`:""}だったので、今日は${m.genre}の${m.name}にしました。`);
  }
  bits.push(`1人前${yen(perPerson(m))}円で、予算${settings.perPersonBudget}円の範囲内です。`);
  return bits.join("");
}

function scaleQty(q,k){
  if(k===1)return q;
  let mm=q.match(/^(\d+)\/(\d+)(.*)$/), v, unit;
  if(mm){v=mm[1]/mm[2]*k;unit=mm[3]}
  else{mm=q.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!mm)return q;v=parseFloat(mm[1])*k;unit=mm[2]}
  if(/^(g|ml)/.test(unit))return Math.round(v/10)*10+unit;
  if(v<1){
    const fr=[[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
    return fr.reduce((a,b)=>Math.abs(b[0]-v)<Math.abs(a[0]-v)?b:a)[1]+unit;
  }
  return (Math.round(v*2)/2)+unit;
}

}

function renderShop(){
  const left=S.shop.filter(i=>!i.done);
  if(!S.shop.length){
    $main.innerHTML=`<section class="screen"><header class="top"><div class="brand">買い物リスト</div></header>
      <div class="empty"><p>献立を決めると、ここに材料が入ります。</p><button class="btn btn-primary" style="max-width:240px" data-act="home">今日の献立を決める</button></div></section>`;
    return;
  }
  const m=MENUS.find(x=>x.id===S.decided);
  $main.innerHTML=`<section class="screen">
    <header class="top"><div class="brand">買い物リスト<small>${m?m.name:""}の材料・${settings.people}人分</small></div></header>
    <div class="panel">
      <div class="month-row"><span>これから買う分</span><span class="num"><b>約${yen(left.reduce((a,i)=>a+i.price,0))}円</b></span></div>
      <p class="hint" style="margin:0">家にあるもの・買ったものはチェックしてください。</p>
      <div class="list">${S.shop.map((i,k)=>`<label class="item ${i.done?"done":""}"><input type="checkbox" id="shop-${k}" data-act="shop-check" data-i="${k}" ${i.done?"checked":""}><span>${i.name}</span><em>${i.qty}</em><em class="num">${yen(i.price)}円</em></label>`).join("")}</div>
    </div>
  </section>`;
}

function renderMoney(){
  const mt=monthTotals();
  const pct=Math.min(100,mt.total/settings.monthBudget*100);
  const counts=Object.fromEntries(CATS.map(c=>[c,LOGS.filter(l=>l.cat===c).length]));
  const n=LOGS.length;
  const hist=LOGS.slice().sort((a,b)=>dayNum(b.d)-dayNum(a.d)).slice(0,10);
  $main.innerHTML=`<section class="screen">
    <header class="top"><div class="brand">9月の家計<small>晩ごはんの食材費</small></div></header>
    <div class="kpis">
      <div class="kpi wide"><small>今月の合計</small><b class="num">${yen(mt.total)}円</b>
        <div class="bar" style="margin-top:8px"><i class="used" style="width:${pct}%"></i></div>
        <small class="num">予算 ${yen(settings.monthBudget)}円・残り ${yen(settings.monthBudget-mt.total)}円（あと7日）</small></div>
      <div class="kpi"><small>1食の平均</small><b class="num">${yen(mt.avg)}円</b></div>
      <div class="kpi"><small>1人前の平均</small><b class="num">${yen(mt.avg/settings.people)}円</b></div>
    </div>
    <div class="panel">
      <h3>主菜のバランス（${n}食）</h3>
      <div class="bar" style="height:16px" role="img" aria-label="${CATS.map(c=>`${c}${counts[c]}回`).join("、")}">${CATS.map(c=>`<i class="${CAT_CLASS[c]}" style="width:${counts[c]/n*100}%"></i>`).join("")}</div>
      <div class="legend">${CATS.map(c=>`<span><i class="${CAT_CLASS[c]}"></i>${c} ${counts[c]}回</span>`).join("")}</div>
      <p class="hint" style="margin:0">お魚の日が週に${(counts["魚"]/n*7).toFixed(1)}回ほど。目安の週2回に近いペースです。</p>
    </div>
    <div class="panel"><h3>最近の記録</h3>
      <div class="hist">${hist.map(l=>`<div class="hrow"><small class="num">${l.d}</small><span>${esc(l.name)}<span class="src ${l.real?"real":""}">${l.real?"実際":"推定"}</span></span><span class="num">${yen(l.cost)}円</span></div>`).join("")}</div>
    </div>
  </section>`;
}

function camIcon(s){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>`}

function render(){
  ({home:renderHome,detail:renderDetail,fridge:renderFridge,shop:renderShop,money:renderMoney})[S.view]();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  const left=S.shop.filter(i=>!i.done).length, bd=document.getElementById("shop-badge");
  bd.hidden=!left; bd.textContent=left;
}
function go(view,tab){S.view=view;if(tab)S.tab=tab;render();window.scrollTo(0,0)}

let toastT;
function toast(msg){
  document.querySelector(".toast")?.remove();
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;
  document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200);
}

function decide(id){
  const m=MENUS.find(x=>x.id===id);
  S.decided=id;
  const k=settings.people/BASE_PEOPLE;
  S.shop=m.ings.filter(i=>!i[0].startsWith("調味料")).map(i=>({name:i[0],qty:i[1]?scaleQty(i[1],k):"",price:i[2]*k,
    done:S.fridge.some(f=>i[0].includes(f)||f.includes(i[0]))}));
  toast("買い物リストに材料を入れました");
  go("home","home");
}

function openCooked(){
  const m=MENUS.find(x=>x.id===S.decided);
  const est=Math.round(menuCost(m));
  const wrap=document.createElement("div");wrap.className="sheet-wrap";
  wrap.innerHTML=`<form class="sheet" id="cook-form" role="dialog" aria-label="作った料理の記録">
    <h2>おつかれさまでした</h2>
    <p class="hint" style="margin:0">${m.name}（${settings.people}人分）の推定は <b class="num">${yen(est)}円</b> です。実際の金額が分かれば直してください。</p>
    <label class="money-in" for="cost-in"><input id="cost-in" inputmode="numeric" value="${est}" aria-label="金額"><span>円</span></label>
    <button class="btn btn-primary" type="submit">記録する</button>
    <button class="btn btn-ghost" type="button" data-act="close-sheet">あとで</button>
  </form>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click",e=>{if(e.target===wrap||e.target.dataset.act==="close-sheet")wrap.remove()});
  wrap.querySelector("form").addEventListener("submit",e=>{
    e.preventDefault();
    const v=parseInt(wrap.querySelector("#cost-in").value.replace(/[^\d]/g,""),10)||est;
    LOGS.push({d:TODAY,name:m.name,cat:m.cat,main:m.main,genre:m.genre,taste:m.taste,cost:v,real:v!==est,id:m.id});
    wrap.remove();
    S.decided=null;S.shop=[];S.fridge=[];rankMenus();
    toast(`${yen(v)}円を記録しました`);
    go("money","money");
  });
}

/* ===== 操作 ===== */
document.addEventListener("click",e=>{
  const tab=e.target.closest("nav.tabs button");
  if(tab){go(tab.dataset.tab,tab.dataset.tab);return}
  const f=e.target.closest("[data-filter]");
  if(f){const v=f.dataset.filter;S.filters.has(v)?S.filters.delete(v):S.filters.add(v);rankMenus();render();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="reroll"){nextPick();render()}
  else if(act==="decide"){decide(a.dataset.id?+a.dataset.id:current().m.id)}
  else if(act==="undecide"){S.decided=null;S.shop=[];render()}
  else if(act==="detail"){S.detailId=+a.dataset.id;go("detail","home")}
  else if(act==="home"){go("home","home")}
  else if(act==="ppl-"||act==="ppl+"){settings.people=Math.max(1,Math.min(6,settings.people+(act==="ppl+"?1:-1)));render()}
  else if(act==="cooked"){openCooked()}
  else if(act==="fridge"){S.photo=null;S.found=null;go("fridge","home")}
  else if(act==="sample"){startScan("sample")}
  else if(act==="retake"){S.photo=null;S.found=null;render()}
  else if(act==="toggle-found"){const it=S.found[+a.dataset.i];it.on=!it.on;render()}
  else if(act==="use-found"){
    S.fridge=S.found.filter(x=>x.on).map(x=>x.n);
    if(!S.fridge.length){toast("食材を1つ以上選んでください");return}
    rankMenus();toast("冷蔵庫の食材で選び直しました");go("home","home");
  }
  else if(act==="clearfridge"){S.fridge=[];rankMenus();render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="photo-in"&&e.target.files[0]){startScan(URL.createObjectURL(e.target.files[0]))}
  if(e.target.dataset.act==="shop-check"){S.shop[+e.target.dataset.i].done=e.target.checked;render()}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="add-form"){
    e.preventDefault();const v=document.getElementById("add-in").value.trim();
    if(v){S.found.push({n:v,on:true});render()}
  }
});
function startScan(src){
  S.photo=src;S.scanning=true;S.found=SAMPLE_FOUND.map(x=>({...x}));render();
  setTimeout(()=>{S.scanning=false;if(S.view==="fridge")render()},1400);
}

rankMenus();
render();
</script>
